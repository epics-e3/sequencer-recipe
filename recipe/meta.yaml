{% set version = "2.2.9" %}

package:
  name: sequencer
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/sequencer/archive/refs/tags/R{{ version|replace('.', '-') }}.tar.gz
    sha256: f5ebecdb231e106bb83db9a5fc877adb03bfd119e879a3668fdfc33d0aacb397
  - path: ../src
  - patches:
    - patch/update_sequencer_rules.p0.patch

build:
  number: 7
  run_exports:
    - {{ pin_subpackage('sequencer', max_pin='x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    - perl
    - re2c
  host:
    - epics-base
    - require

test:
  files:
    - test/test.st
  requires:
    - run-iocsh
  commands:
    - lemon -x
    - snc test/test.st
    - run-iocsh -r sequencer

about:
  home: https://github.com/epics-modules/sequencer
  dev_url: https://hub.darcs.net/bf/seq-branch-2-2
  doc_url: https://epics-modules.github.io/sequencer/
  license: EPICS
  license_file: LICENSE
  summary: "EPICS State Notation Language compiler and runtime sequencer"
