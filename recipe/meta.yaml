{% set version = "2.2.9" %}

package:
  name: sequencer
  version: "{{ version }}"

source:
  - url: https://github.com/epics-modules/sequencer/archive/refs/tags/R2-2-9.tar.gz
    sha256: f5ebecdb231e106bb83db9a5fc877adb03bfd119e879a3668fdfc33d0aacb397
  - path: ../src


build:
  number: 2
  run_exports:
    - {{ pin_subpackage('sequencer', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - re2c
  host:
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - test -f "${PREFIX}/modules/sequencer/{{ version }}/bin/linux-x86_64/lemon"
    - test -f "${PREFIX}/modules/sequencer/{{ version }}/bin/linux-x86_64/snc"
    - run-iocsh -r sequencer

about:
  home: https://www-csr.bessy.de/control/SoftDist/sequencer/index.html
  license: EPICS Open License
  summary: "EPICS State Notation Language compiler and runtime sequencer"
