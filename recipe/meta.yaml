{% set version = "2.2.7" %}

package:
  name: seq
  version: "{{ version }}"

source:
  - url: https://www-csr.bessy.de/control/SoftDist/sequencer/releases/seq-{{ version }}.tar.gz
    sha256: 7f63b5349ec9d72a096ad9e14fe54bfd5cb78ebbe832c57fc87775550451f983
  - path: ../src


build:
  number: 2
  # Using max_pin='x.x' should be fine according to
  # https://www-csr.bessy.de/control/SoftDist/sequencer-2-1/Introduction.html#versioning-policy
  # For consistency and to avoid issue we use x.x.x.x
  run_exports:
    - {{ pin_subpackage('seq', max_pin='x.x.x.x') }}

requirements:
  build:
    - make
    - perl
    - tclx
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - re2c
  host:
    - epics-base
    - require

test:
  requires:
    - run-iocsh
  commands:
    - test -f "${PREFIX}/modules/seq/{{ version }}/bin/linux-x86_64/lemon"
    - test -f "${PREFIX}/modules/seq/{{ version }}/bin/linux-x86_64/snc"
    - run-iocsh -r seq

about:
  home: https://www-csr.bessy.de/control/SoftDist/sequencer/index.html
  license: EPICS Open License
  summary: "EPICS State Notation Language compiler and runtime sequencer"
